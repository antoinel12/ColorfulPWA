<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful PWA</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="form-group">
            <label for="url-input">URL</label>
            <input type="text" id="url-input" readonly>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="enabled-checkbox">
                <span>Enabled</span>
            </label>
        </div>

        <div class="form-group">
            <label for="color-input">Color</label>
            <input type="color" id="color-input" value="#FFFFFF">
            <div class="color-picker-wrapper">
                
            </div>
        </div>
    </div>
    <div><a href="https://github.com/antoinel12/ColorfulPWA" target="_blank">ColorfulPWA</a> <span id="version"></span></div>

    <script src="popup.js"></script>
</body>
</html>
